[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "business-entity-resolution"
version = "0.1.0"
description = "Auditable retrieval and matching experiments for the business entity resolution challenge"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy>=1.26,<2", "scipy>=1.13", "pandas>=2.2", "scikit-learn>=1.4", "PyYAML>=6", "joblib>=1.4", "rapidfuzz>=3.13"]

[project.scripts]
ber = "ber.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
